[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned compiler for reproducible, reviewable builds.
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# viaIR: the launch() configuration struct is wide (24 fields); the legacy
# codegen hits stack-too-deep without the IR pipeline.
via_ir = true

# Remappings for dependencies.
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "v4-core/=lib/v4-core/src/",
    "v4-periphery/=lib/v4-periphery/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Pearls targets Base Sepolia (84532) and local Anvil (31337) ONLY.
# The deploy script enforces this in code; see script/Deploy.s.sol.
